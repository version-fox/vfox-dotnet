name: Test Plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Offline hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # vfox plugin test finds tests/**/*_test.lua and runs each file in its
      # own VM. The release is pinned and its checksum checked, like the
      # archives in the E2E workflow; change both together to move releases.
      - name: Install vfox
        env:
          VFOX_VERSION: 1.1.0
          VFOX_SHA256: 3b33c3c468b27bc17aecf0d6d3af24fe49fe204972984904a136a47b402a0ee4
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/vfox_${VFOX_VERSION}_linux_x86_64.tar.gz"
          echo "$VFOX_SHA256  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/vfox"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/vfox" --strip-components=1 \
            "vfox_${VFOX_VERSION}_linux_x86_64/vfox"
          echo "$RUNNER_TEMP/vfox" >> "$GITHUB_PATH"
      - name: Run the offline hook tests
        run: vfox plugin test .
