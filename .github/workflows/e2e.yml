name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the previous run. Every commit on
  # main gets its own group so re-running an older one cannot cancel a newer.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    name: Ubuntu container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the Ubuntu container E2E suite
        working-directory: tests/e2e
        run: go test -v -timeout 55m -run TestE2E ./linux

  e2e-windows:
    name: Windows container
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the Windows container E2E suite
        working-directory: tests/e2e
        run: go test -v -timeout 55m -run TestE2E ./windows
