name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the previous run. Every commit on
  # main gets its own group so re-running an older one cannot cancel a newer.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    name: Ubuntu container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the Ubuntu E2E image
        run: docker build --file tests/e2e/linux/Dockerfile --tag vfox-dotnet-e2e:linux .
      - name: Install and use dotnet through the plugin
        run: docker run --rm vfox-dotnet-e2e:linux bash /e2e/e2e.sh

  e2e-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install and use dotnet through the plugin
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./tests/e2e/windows/e2e.ps1
